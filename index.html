<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>R4GE-Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<script>
  	if ("serviceWorker" in navigator)
    		navigator.serviceWorker.register("sw.js");
	</script>
        <style>
            :root {
                --bg: #f1f4f6;
                --card: #fff;
                --ink: #17242f;
                --mute: #6a7885;
                --line: #dbe2e8;
                --acc: #0e6b73;
                --acc2: #e3f1f2;
                --in: #1f7a46;
                --out: #b0412c;
                --warn: #fdeee9;
                --vac: #e4f2e5;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f161c;
                    --card: #18222b;
                    --ink: #e6edf2;
                    --mute: #8d9ca8;
                    --line: #2a3743;
                    --acc: #4cc3cc;
                    --acc2: #16343a;
                    --in: #5bd08b;
                    --out: #ff8f78;
                    --warn: #3a2019;
                    --vac: #1b3324;
                }
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
            }
            body {
                background: var(--bg);
                color: var(--ink);
                font:
                    16px/1.45 system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
            }
            main {
                max-width: 980px;
                margin: 0 auto;
                padding: 16px;
            }
            h1 {
                font-size: 1.5rem;
                margin: 4px 0 14px;
            }
            .bar {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 14px;
            }
            .bar h1 {
                flex: 1;
                margin: 0;
                font-size: 1.25rem;
            }
            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 8px 12px;
                cursor: pointer;
            }
            button.p {
                background: var(--acc);
                border-color: var(--acc);
                color: var(--bg);
                font-weight: 600;
            }
            button.d {
                color: var(--out);
            }
            button:focus-visible,
            input:focus-visible,
            select:focus-visible,
            textarea:focus-visible {
                outline: 2px solid var(--acc);
                outline-offset: 2px;
            }
            .day {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                margin-bottom: 10px;
                overflow: hidden;
            }
            .day.today {
                border-color: var(--acc);
                box-shadow: 0 0 0 1px var(--acc);
            }
            .dh {
                display: flex;
                align-items: center;
                padding: 8px 12px;
                background: var(--acc2);
                font-weight: 600;
            }
            .dh span {
                flex: 1;
            }
            .row {
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 10px 12px;
                border-top: 1px solid var(--line);
                cursor: pointer;
            }
            .row .t {
                flex: 1;
                min-width: 0;
                overflow-wrap: anywhere;
            }
            .row small {
                color: var(--mute);
            }
            .row.done .t {
                text-decoration: line-through;
                color: var(--mute);
            }
            .row.late {
                background: var(--warn);
            }
            .chk {
                width: 22px;
                height: 22px;
                accent-color: var(--acc);
                flex: none;
            }
            .tag {
                font-size: 0.75rem;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 1px 6px;
                color: var(--mute);
            }
            .empty {
                padding: 10px 12px;
                color: var(--mute);
                font-size: 0.9rem;
            }
            .sum {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                margin-bottom: 12px;
            }
            .sum div {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px;
            }
            .sum b {
                display: block;
                font-size: 1.1rem;
            }
            .in {
                color: var(--in);
            }
            .out {
                color: var(--out);
            }
            .ratio {
                height: 8px;
                border-radius: 4px;
                background: var(--out);
                overflow: hidden;
                margin-bottom: 12px;
            }
            .ratio i {
                display: block;
                height: 100%;
                background: var(--in);
            }
            .list {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                overflow: hidden;
            }
            .list .row:first-child {
                border-top: 0;
            }
            .note {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 12px;
                margin-bottom: 10px;
                cursor: pointer;
            }
            .note b {
                display: block;
            }
            .note small {
                display: block;
                color: var(--mute);
            }
            .note p {
                margin: 4px 0 0;
                white-space: pre-wrap;
                color: var(--mute);
                overflow-wrap: anywhere;
            }
            .banner {
                background: var(--warn);
                border: 1px solid var(--out);
                border-radius: 12px;
                padding: 10px 12px;
                margin-bottom: 12px;
            }
            nav {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                background: var(--card);
                border-top: 1px solid var(--line);
                padding-bottom: env(safe-area-inset-bottom);
            }
            nav button {
                flex: 1;
                border: 0;
                border-radius: 0;
                background: none;
                padding: 12px 2px;
                font-size: 0.78rem;
                color: var(--mute);
            }
            nav button.on {
                color: var(--acc);
                font-weight: 700;
                box-shadow: inset 0 3px var(--acc);
            }
            dialog {
                border: 1px solid var(--line);
                border-radius: 14px;
                background: var(--card);
                color: var(--ink);
                width: min(440px, 92vw);
                padding: 16px;
            }
            dialog::backdrop {
                background: rgba(0, 0, 0, 0.45);
            }
            label {
                display: block;
                font-size: 0.85rem;
                color: var(--mute);
                margin-top: 10px;
            }
            input,
            select,
            textarea {
                width: 100%;
                padding: 9px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--bg);
                margin-top: 3px;
            }
            .acts {
                display: flex;
                gap: 8px;
                margin-top: 16px;
            }
            .acts .sp {
                flex: 1;
            }
            .hint {
                color: var(--mute);
                font-size: 0.9rem;
            }
            .wrap {
                overflow-x: auto;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                margin-bottom: 8px;
            }
            .cal {
                display: grid;
                grid-template-columns: 42px repeat(7, minmax(88px, 1fr));
                min-width: 700px;
            }
            .ch {
                padding: 6px 5px;
                border-left: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                font-size: 0.82rem;
                min-width: 0;
            }
            .chh {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .chh button {
                padding: 0 8px;
                line-height: 1.6;
                border-radius: 8px;
            }
            .ch small {
                display: block;
                color: var(--mute);
                overflow-wrap: anywhere;
            }
            .ch.today {
                background: var(--acc2);
            }
            .ch.hol,
            .cc.hol {
                background-color: var(--warn);
            }
            .ch.vac,
            .cc.vac {
                background-color: var(--vac);
            }
            .ch.hol small {
                color: var(--out);
            }
            .chip {
                margin-top: 3px;
                padding: 2px 5px;
                border-radius: 5px;
                background: var(--acc);
                color: var(--bg);
                font-size: 0.75rem;
                cursor: pointer;
                overflow-wrap: anywhere;
            }
            .ax {
                position: relative;
                height: 704px;
            }
            .ax span {
                position: absolute;
                right: 4px;
                transform: translateY(-50%);
                font-size: 0.7rem;
                color: var(--mute);
            }
            .ax span:first-child {
                transform: none;
            }
            .cc {
                position: relative;
                height: 704px;
                border-left: 1px solid var(--line);
                background-image: repeating-linear-gradient(to bottom, transparent 0 43px, var(--line) 43px 44px);
            }
            .shift {
                position: absolute;
                left: 3px;
                right: 3px;
                border: 1px solid var(--acc);
                background: var(--acc2);
                border-radius: 6px;
                overflow: hidden;
            }
            .brk {
                position: absolute;
                left: 0;
                right: 0;
                background: repeating-linear-gradient(135deg, var(--card) 0 3px, transparent 3px 6px);
                border-block: 1px solid var(--acc);
            }
            .ev {
                position: absolute;
                left: 9px;
                right: 2px;
                border-radius: 6px;
                padding: 2px 5px;
                font-size: 0.76rem;
                line-height: 1.25;
                overflow: hidden;
                cursor: pointer;
                z-index: 2;
            }
            .ev.tm {
                background: var(--acc);
                color: var(--bg);
            }
            .ev.tk {
                background: var(--card);
                border: 1px dashed var(--acc);
                color: var(--ink);
            }
            .done {
                opacity: 0.55;
                text-decoration: line-through;
            }
            .sub {
                font-size: 1.05rem;
                margin: 18px 0 6px;
            }
            label.opt {
                display: flex;
                margin: 0;
                font-size: 1rem;
                color: var(--ink);
            }
            .qa {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin-bottom: 10px;
            }
            .qa input {
                margin-top: 0;
                width: auto;
                flex: 0 0 auto;
            }
            .qa input[name="title"] {
                flex: 1 1 180px;
                min-width: 0;
            }
            .sum {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }
            .sum small {
                display: block;
                color: var(--mute);
                font-size: 0.75rem;
                overflow-wrap: anywhere;
            }
            .seg {
                display: flex;
                margin-bottom: 12px;
            }
            .seg button {
                flex: 1;
                border-radius: 0;
            }
            .seg button:first-child {
                border-radius: 10px 0 0 10px;
            }
            .seg button:last-child {
                border-radius: 0 10px 10px 0;
            }
            .seg button.on {
                background: var(--acc);
                border-color: var(--acc);
                color: var(--bg);
                font-weight: 600;
            }
            .cg {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 12px;
                margin-bottom: 12px;
            }
            .cd {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px 12px;
                min-width: 0;
            }
            .cd h3 {
                margin: 0 0 8px;
                font-size: 0.95rem;
            }
            .svg {
                width: 100%;
                height: auto;
                display: block;
            }
            .bi {
                fill: var(--in);
            }
            .bo {
                fill: var(--out);
            }
            .tx {
                fill: var(--mute);
                font-size: 11px;
            }
            .ln {
                stroke: var(--line);
                stroke-width: 1;
            }
            .pl {
                fill: none;
                stroke: var(--acc);
                stroke-width: 2.5;
                stroke-linejoin: round;
            }
            .dn {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
            }
            .ring {
                width: 150px;
                flex: none;
                color: var(--ink);
            }
            .leg {
                flex: 1;
                min-width: 190px;
            }
            .lg {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 4px 6px;
                border-radius: 8px;
                font-size: 0.88rem;
            }
            .lg[data-a] {
                cursor: pointer;
            }
            .lg.on {
                background: var(--acc2);
            }
            .lg i {
                width: 10px;
                height: 10px;
                border-radius: 3px;
                flex: none;
            }
            .lg span {
                flex: 1;
                min-width: 0;
                overflow-wrap: anywhere;
            }
            .lg small {
                color: var(--mute);
                width: 2.8em;
                text-align: right;
            }
            .hb {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 2px 8px;
                margin-bottom: 8px;
                font-size: 0.88rem;
            }
            .hb span {
                overflow-wrap: anywhere;
            }
            .hb u {
                grid-column: 1/3;
                display: block;
                height: 6px;
                border-radius: 3px;
                background: var(--line);
                text-decoration: none;
            }
            .hb u i {
                display: block;
                height: 100%;
                border-radius: 3px;
                background: var(--out);
            }
            .tpls {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 12px;
            }
            .tpls button {
                border-radius: 999px;
                padding: 6px 12px;
            }
            .tpls .tpl {
                background: var(--acc2);
                border-color: var(--acc);
            }
            .tpls .tpl small {
                color: var(--mute);
            }
            .tpls.ed .tpl {
                border-style: dashed;
            }
            .chip.fx {
                background: var(--card);
                color: var(--ink);
                border: 1px solid var(--acc);
            }
            .panel.hh .bar > h1 {
                display: none;
            }
            .panel.hh .bar {
                justify-content: flex-end;
                margin-bottom: 8px;
            }
            .segw {
                margin-top: 16px;
            }
            .segw button {
                font-size: 0.8rem;
                padding: 8px 4px;
                white-space: normal;
            }
            details.cd summary {
                cursor: pointer;
            }
            .fs {
                display: flex;
                gap: 8px;
                align-items: flex-end;
                margin-bottom: 12px;
            }
            .fs label {
                flex: 1;
                margin: 0;
                min-width: 0;
            }
        </style>
    </head>
    <body>
        <main id="main"></main>
        <nav id="nav"></nav>
        <dialog id="dlg"><form id="frm"></form></dialog>
        <input type="file" id="imp" accept="application/json" hidden />
        <input type="file" id="csv" accept=".csv,.txt,text/csv" hidden />
        <script>
            const KEY = "mein-alltag-v1";
            let S = {
                week: [],
                fin: [],
                todos: [],
                notes: [],
                rem: [],
                vac: [],
                fix: [],
                imports: [],
                cfg: { hol: [] },
            };
            try {
                const r = localStorage.getItem(KEY);
                if (r) Object.assign(S, JSON.parse(r));
            } catch (e) {}
            const save = () => {
                try {
                    localStorage.setItem(KEY, JSON.stringify(S));
                } catch (e) {}
            };
            // Vorlagen für den Kalender (frei änderbar in der App)
            const DEF_TPL = [
                ["Fahrstunde", "Termin"],
                ["Klausur", "Termin"],
                ["Fitnessstudio", "Termin"],
                ["Arzttermin", "Termin"],
                ["Lernen", "Aufgabe"],
                ["Einkaufen", "Aufgabe"],
            ];
            const norm = () => {
                if (!Array.isArray(S.tpl))
                    S.tpl = DEF_TPL.map((t) => ({
                        id: Math.random().toString(36).slice(2, 8),
                        title: t[0],
                        type: t[1],
                        time: "",
                        end: "",
                    }));
            };
            norm();

            // Module: hier lassen sich weitere Felder oder Module ergänzen
            const D = {
                week: {
                    f: [
                        ["date", "Datum", "date"],
                        ["time", "Beginn (optional)", "time"],
                        ["end", "Ende (optional)", "time"],
                        ["title", "Titel", "text"],
                        ["type", "Art", "select", ["Termin", "Aufgabe"]],
                        ["state", "Status", "select", ["Offen", "Erledigt"]],
                        ["memo", "Notiz", "textarea"],
                        ["rdate", "Erinnerung am (optional)", "date"],
                        ["rtime", "Uhrzeit der Erinnerung", "time"],
                    ],
                },
                fix: {
                    f: [
                        ["title", "Name", "text"],
                        ["kind", "Art", "select", ["Geburtstag", "Zahltag", "Sonstiges"]],
                        [
                            "rule",
                            "Wiederholung",
                            "select",
                            ["Jährlich", "Monatlich", "Letzter Werktag im Monat", "Wöchentlich"],
                        ],
                        ["date", "Datum (Geburtsdatum bzw. Starttag)", "date"],
                        ["memo", "Notiz", "textarea"],
                    ],
                },
                vac: {
                    f: [
                        ["date", "Von", "date"],
                        ["to", "Bis", "date"],
                        ["title", "Bezeichnung", "text"],
                        ["memo", "Notiz", "textarea"],
                        ["rdate", "Erinnerung am (optional)", "date"],
                        ["rtime", "Uhrzeit der Erinnerung", "time"],
                    ],
                },
                tpl: {
                    f: [
                        ["title", "Name der Vorlage", "text"],
                        ["type", "Art", "select", ["Termin", "Aufgabe"]],
                        ["time", "Standard-Beginn (optional)", "time"],
                        ["end", "Standard-Ende (optional)", "time"],
                    ],
                },
                fin: {
                    f: [
                        ["date", "Datum", "date"],
                        ["title", "Bezeichnung", "text"],
                        ["cat", "Kategorie", "text"],
                        ["amount", "Betrag in €", "number"],
                        ["kind", "Art", "select", ["Ausgabe", "Einnahme"]],
                        ["note", "Verwendungszweck", "text"],
                        ["memo", "Notiz", "textarea"],
                        ["rdate", "Erinnerung am (optional)", "date"],
                        ["rtime", "Uhrzeit der Erinnerung", "time"],
                    ],
                },
                todos: {
                    f: [
                        ["title", "Aufgabe", "text"],
                        ["memo", "Notiz", "textarea"],
                        ["rdate", "Erinnerung am (optional)", "date"],
                        ["rtime", "Uhrzeit der Erinnerung", "time"],
                    ],
                },
                notes: {
                    f: [
                        ["title", "Titel", "text"],
                        ["text", "Notiz", "textarea"],
                    ],
                },
                rem: {
                    f: [
                        ["date", "Datum", "date"],
                        ["time", "Uhrzeit", "time"],
                        ["title", "Erinnerung", "text"],
                        ["memo", "Notiz", "textarea"],
                    ],
                },
            };
            const TABS = [
                ["week", "Woche"],
                ["fin", "Finanzen"],
                ["data", "Daten"],
            ];
            let tab = "week",
                wk = 0,
                mo = 0;

            const esc = (s) =>
                String(s ?? "").replace(
                    /[&<>"]/g,
                    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
                );
            const iso = (d) =>
                d.getFullYear() +
                "-" +
                String(d.getMonth() + 1).padStart(2, "0") +
                "-" +
                String(d.getDate()).padStart(2, "0");
            const addDays = (d, n) => {
                const x = new Date(d);
                x.setDate(x.getDate() + n);
                return x;
            };
            const monday = (d) => {
                const x = new Date(d);
                x.setHours(0, 0, 0, 0);
                x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
                return x;
            };
            const eur = (n) => Number(n || 0).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
            const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const dnice = (ds) =>
                new Date(ds + "T00:00").toLocaleDateString("de-DE", {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                });
            const cmp = (a, b) => ((a.date || "") + (a.time || "")).localeCompare((b.date || "") + (b.time || ""));

            function form(mod, id, pre) {
                const cur = id ? S[mod].find((e) => e.id === id) : Object.assign({}, pre);
                const fr = document.getElementById("frm");
                fr.innerHTML =
                    D[mod].f
                        .map(([k, l, t, o]) => {
                            const v = esc(cur[k] ?? (k === "date" && !id ? iso(new Date()) : ""));
                            const inp =
                                t === "select"
                                    ? '<select name="' +
                                      k +
                                      '">' +
                                      o
                                          .map((x) => {
                                              const v = Array.isArray(x) ? x[0] : x,
                                                  l = Array.isArray(x) ? x[1] : x;
                                              return (
                                                  '<option value="' +
                                                  esc(v) +
                                                  '"' +
                                                  (cur[k] === v ? " selected" : "") +
                                                  ">" +
                                                  esc(l) +
                                                  "</option>"
                                              );
                                          })
                                          .join("") +
                                      "</select>"
                                    : t === "textarea"
                                      ? '<textarea name="' +
                                        k +
                                        '" rows="' +
                                        (k === "memo" ? 3 : 6) +
                                        '">' +
                                        v +
                                        "</textarea>"
                                      : '<input name="' +
                                        k +
                                        '" type="' +
                                        t +
                                        '" value="' +
                                        v +
                                        '"' +
                                        (t === "number" ? ' step="0.01" inputmode="decimal"' : "") +
                                        (k === "title" ? " required" : "") +
                                        ">";
                            return "<label>" + l + inp + "</label>";
                        })
                        .join("") +
                    '<div class="acts">' +
                    (id ? '<button type="button" class="d" id="del">Löschen</button>' : "") +
                    '<span class="sp"></span><button type="button" id="cx">Abbrechen</button><button class="p">Speichern</button></div>';
                const dlg = document.getElementById("dlg");
                fr.onsubmit = (e) => {
                    e.preventDefault();
                    const fd = Object.fromEntries(new FormData(fr));
                    if (mod === "rref") {
                        const q = (fd.ref || "").split(":"),
                            it = q[0] && S[q[0]] ? S[q[0]].find((x) => x.id === q[1]) : null;
                        if (it && fd.rdate) {
                            it.rdate = fd.rdate;
                            it.rtime = fd.rtime || "";
                            it.rdone = false;
                            save();
                        }

                        if (!e.done) up.push({ m: "rem", e, date: e.date, time: e.time || "", lbl: "Erinnerung" });
                    });
                    up.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
                    S.todos.forEach((e) => {
                        if (!e.done) up.push({ m: "todos", e, date: "", time: "", lbl: "To-Do" });
                    });
                    const done = S.todos.filter((e) => e.done);
                    const row = (u) => {
                        const late =
                            u.date && u.date + (u.time || "23:59") < now && !(u.m === "week" && u.e.type !== "Aufgabe");
                        return (
                            '<div class="row' +
                            (late ? " late" : "") +
                            '" data-a="edit" data-m="' +
                            u.m +
                            '" data-id="' +
                            u.e.id +
                            '"><input class="chk" type="checkbox" data-a="tog" data-m="' +
                            u.m +
                            '" data-id="' +
                            u.e.id +
                            '" aria-label="Erledigt"><div class="t">' +
                            esc(u.e.title) +
                            "<br><small>" +
                            (u.date ? fd(u.date) + (u.time ? ", " + esc(u.time) : "") + " · " : "") +
                            u.lbl +
                            (late ? " · überfällig" : "") +
                            (u.e.memo ? "<br>✎ " + esc(u.e.memo.slice(0, 80)) : "") +
                            "</small></div></div>"
                        );
                    };
                    return (
                        '<div class="bar"><h1>To-Dos</h1>' +
                        (done.length ? '<button data-a="clr" data-m="todos">Erledigte entfernen</button>' : "") +
                        addBtn("todos") +
                        "</div>" +
                        '<h2 class="sub">Anstehend (' +
                        up.length +
                        ')</h2><div class="list">' +
                        (up.length ? up.map(row).join("") : '<div class="empty">Nichts offen.</div>') +
                        "</div>" +
                        fxHtml() +
                        (done.length
                            ? '<h2 class="sub">Erledigte To-Dos</h2><div class="list">' +
                              done
                                  .map(
                                      (e) =>
                                          '<div class="row done" data-a="edit" data-m="todos" data-id="' +
                                          e.id +
                                          '"><input class="chk" type="checkbox" data-a="tog" data-m="todos" data-id="' +
                                          e.id +
                                          '" checked aria-label="Erledigt"><div class="t">' +
                                          esc(e.title) +
                                          "</div></div>"
                                  )
                                  .join("") +
                              "</div>"
                            : "")
                    );
                },
                notes() {
                    const mi = memoItems();
                    return (
                        '<div class="bar"><h1>Notizen</h1><button data-a="nref">+ Zu Eintrag</button>' +
                        addBtn("notes") +
                        "</div>" +
                        '<h2 class="sub" style="margin-top:0">Notizen zu Einträgen (' +
                        mi.length +
                        ')</h2><p class="hint" style="margin-top:0">Antippen, um Eintrag und Notiz zu bearbeiten.</p>' +
                        (mi.length
                            ? mi
                                  .map(
                                      (x) =>
                                          '<div class="note" data-a="edit" data-m="' +
                                          x.m +
                                          '" data-id="' +
                                          x.e.id +
                                          '"><b>' +
                                          esc(x.e.title) +
                                          "</b><small>" +
                                          SRC[x.m] +
                                          (x.e.date ? " · " + fd(x.e.date) : "") +
                                          "</small><p>" +
                                          esc(x.e.memo) +
                                          "</p></div>"
                                  )
                                  .join("")
                            : '<div class="empty">Noch keine Notizen an Einträgen. Nutze „+ Zu Eintrag“ oder das Feld „Notiz“ in jedem Eintrag.</div>') +
                        '<h2 class="sub">Eigene Notizen</h2>' +
                        (S.notes.length
                            ? S.notes
                                  .map(
                                      (e) =>
                                          '<div class="note" data-a="edit" data-m="notes" data-id="' +
                                          e.id +
                                          '"><b>' +
                                          esc(e.title) +
                                          "</b><p>" +
                                          esc(e.text) +
                                          "</p></div>"
                                  )
                                  .join("")
                            : '<div class="empty">Noch keine eigenen Notizen.</div>')
                    );
                },
                rem() {
                    const now = Date.now(),
                        items = remItems(),
                        lead = S.cfg.lead || 0;
                    const own = S.rem.slice().sort((a, b) => !!a.done - !!b.done || cmp(a, b));
                    const ownRow = (e) => {
                        const late = !e.done && new Date(e.date + "T" + (e.time || "23:59")).getTime() < now;
                        return (
                            '<div class="row' +
                            (e.done ? " done" : "") +
                            (late ? " late" : "") +
                            '" data-a="edit" data-m="rem" data-id="' +
                            e.id +
                            '"><input class="chk" type="checkbox" data-a="tog" data-m="rem" data-id="' +
                            e.id +
                            '"' +
                            (e.done ? " checked" : "") +
                            ' aria-label="Erledigt"><div class="t">' +
                            esc(e.title) +
                            "<br><small>" +
                            fd(e.date) +
                            (e.time ? ", " + esc(e.time) + " Uhr" : "") +
                            (late ? " · überfällig" : "") +
                            (e.memo ? "<br>✎ " + esc(e.memo.slice(0, 80)) : "") +
                            "</small></div></div>"
                        );
                    };
                    const itRow = (x) => {
                        const e = x.e,
                            late = !e.rdone && new Date(e.rdate + "T" + (e.rtime || "23:59")).getTime() < now;
                        return (
                            '<div class="row' +
                            (e.rdone ? " done" : "") +
                            (late ? " late" : "") +
                            '" data-a="edit" data-m="' +
                            x.m +
                            '" data-id="' +
                            e.id +
                            '"><input class="chk" type="checkbox" data-a="rtog" data-m="' +
                            x.m +
                            '" data-id="' +
                            e.id +
                            '"' +
                            (e.rdone ? " checked" : "") +
                            ' aria-label="Erledigt"><div class="t">' +
                            esc(e.title) +
                            "<br><small>" +
                            SRC[x.m] +
                            " · " +
                            fd(e.rdate) +
                            (e.rtime ? ", " + esc(e.rtime) + " Uhr" : "") +
                            (late ? " · überfällig" : "") +
                            "</small></div></div>"
                        );
                    };
                    const on = S.cfg.notif && "Notification" in window && Notification.permission === "granted";
                    return (
                        '<div class="bar"><h1>Erinnerungen</h1><button data-a="rref">+ Zu Eintrag</button>' +
                        addBtn("rem") +
                        "</div>" +
                        '<details class="cd" id="nd" style="margin-bottom:12px"' +
                        (ndet ? " open" : "") +
                        "><summary><b>Mitteilungen</b> · " +
                        (on ? "aktiv" : "aus") +
                        '</summary><p class="hint" style="margin:8px 0">' +
                        notifStatus() +
                        '</p><div class="acts" style="margin-top:0;align-items:flex-end"><button class="' +
                        (on ? "" : "p") +
                        '" data-a="notif">' +
                        (on ? "Ausschalten" : "Mitteilungen aktivieren") +
                        '</button><span class="sp"></span><label style="margin:0;flex:1">Vorlaufzeit<select id="lead">' +
                        [
                            [0, "Zur Erinnerungszeit"],
                            [10, "10 Minuten vorher"],
                            [30, "30 Minuten vorher"],
                            [60, "1 Stunde vorher"],
                            [1440, "1 Tag vorher"],
                        ]
                            .map(
                                (o) =>
                                    '<option value="' +
                                    o[0] +
                                    '"' +
                                    (lead === o[0] ? " selected" : "") +
                                    ">" +
                                    o[1] +
                                    "</option>"
                            )
                            .join("") +
                        "</select></label></div></details>" +
                        '<h2 class="sub" style="margin-top:0">Erinnerungen zu Einträgen (' +
                        items.length +
                        ')</h2><p class="hint" style="margin-top:0">Antippen, um den Eintrag zu bearbeiten.</p>' +
                        '<div class="list">' +
                        (items.length
                            ? items.map(itRow).join("")
                            : '<div class="empty">Noch keine Erinnerungen an Einträgen. Nutze „+ Zu Eintrag“ oder das Feld „Erinnerung am“ in jedem Eintrag.</div>') +
                        "</div>" +
                        '<div class="bar"><h2 class="sub" style="flex:1;margin:18px 0 6px">Eigene Erinnerungen</h2>' +
                        (S.rem.some((e) => e.done)
                            ? '<button data-a="clr" data-m="rem">Erledigte entfernen</button>'
                            : "") +
                        "</div>" +
                        '<div class="list">' +
                        (own.length
                            ? own.map(ownRow).join("")
                            : '<div class="empty">Noch keine eigenen Erinnerungen.</div>') +
                        "</div>"
                    );
                },
                data() {
                    const on = S.cfg.hol;
                    return (
                        '<div class="bar"><h1>Daten</h1></div><h2 class="sub">Feiertage</h2><p class="hint">Bundesweite Feiertage sind immer aktiv. Hake zusätzlich die Feiertage deines Bundeslands an.</p><div class="list">' +
                        OPT.map(
                            (o) =>
                                '<label class="row opt"><input class="chk" type="checkbox" data-a="hol" data-k="' +
                                o[0] +
                                '"' +
                                (on.includes(o[0]) ? " checked" : "") +
                                '><div class="t">' +
                                o[1] +
                                "</div></label>"
                        ).join("") +
                        "</div>" +
                        '<h2 class="sub">Sicherung</h2><p class="hint">Alle Daten liegen nur in diesem Browser auf diesem Gerät. Smartphone und PC werden nicht automatisch abgeglichen: Exportiere eine Sicherung und importiere sie auf dem anderen Gerät.</p><div class="acts"><button class="p" data-a="exp">Sicherung exportieren</button><button data-a="imp">Sicherung importieren</button></div><p class="hint" id="st" role="status"></p>'
                    );
                },
            };

            function render() {
                document.getElementById("nav").innerHTML = TABS.map(
                    ([k, l]) =>
                        '<button data-a="tab" data-k="' +
                        k +
                        '"' +
                        (k === tab ? ' class="on"' : "") +
                        ">" +
                        l +
                        "</button>"
                ).join("");
                const today = iso(new Date()),
                    now = today + new Date().toTimeString().slice(0, 5);
                const due = dueList().filter((x) => x.at <= Date.now());
                document.getElementById("main").innerHTML =
                    (!(tab === "week" && wp === "rem") && due.length
                        ? '<div class="banner" data-a="wp" data-k="rem"><b>' +
                          due.length +
                          " Erinnerung" +
                          (due.length > 1 ? "en" : "") +
                          " fällig</b><br>" +
                          esc(due[0].e.title) +
                          (due.length > 1 ? " und weitere" : "") +
                          "</div>"
                        : "") + V[tab]();
            }

            document.addEventListener("click", (e) => {
                const el = e.target.closest("[data-a]");
                if (!el) {
                    const c = e.target.closest(".cc");
                    if (c) {
                        const r = c.getBoundingClientRect(),
                            mm = Math.min(
                                Math.max(Math.round((T0 * 60 + ((e.clientY - r.top) / H) * 60) / 30) * 30, T0 * 60),
                                T1 * 60 - 30
                            );
                        form("week", null, {
                            date: c.dataset.d,
                            time: String(Math.floor(mm / 60)).padStart(2, "0") + ":" + String(mm % 60).padStart(2, "0"),
                        });
                    }
                    return;
                }
                const a = el.dataset.a,
                    m = el.dataset.m,
                    id = el.dataset.id;
                if (a === "rtog") {
                    e.stopPropagation();
                    const it = S[m].find((x) => x.id === id);
                    it.rdone = el.checked;
                    save();
                    render();
                    return;
                }
                if (a === "hol") {
                    e.stopPropagation();
                    const k = el.dataset.k;
                    if (el.checked) {
                        if (!S.cfg.hol.includes(k)) S.cfg.hol.push(k);
                    } else S.cfg.hol = S.cfg.hol.filter((x) => x !== k);
                    save();
                    return;
                }
                if (a === "tog") {
                    e.stopPropagation();
                    const it = S[m].find((x) => x.id === id);
                    it.done = el.checked;
                    if (m === "week") it.state = el.checked ? "Erledigt" : "Offen";
                    save();
                    render();
                    return;
                }
                if (a === "tab") {
                    tab = el.dataset.k;
                    render();
                    window.scrollTo(0, 0);
                } else if (a === "nav") {
                    const n = +el.dataset.n;
                    if (el.dataset.k === "wk") wk = n ? wk + n : 0;
                    else mo = n ? mo + n : 0;
                    render();
                } else if (a === "add")
                    form(m, null, m === "vac" ? { title: "Urlaub" } : el.dataset.d ? { date: el.dataset.d } : {});
                else if (a === "edit") form(m, id);
                else if (a === "clr") {
                    S[m] = S[m].filter((x) => !x.done);
                    save();
                    render();
                } else if (a === "exp") {
                    const txt = JSON.stringify(S, null, 2),
                        fn = "mein-alltag-" + iso(new Date()) + ".json";
                    const st = document.getElementById("st");
                    (async () => {
                        let dl = null;
                        try {
                            dl = window.claude && (await window.claude.use("downloads"));
                        } catch (err) {}
                        if (dl) {
                            try {
                                await dl.save({ filename: fn, data: txt });
                                if (st) st.textContent = "Sicherung gespeichert.";
                            } catch (err) {
                                if (st) st.textContent = "Speichern abgebrochen.";
                            }
                            return;
                        }
                        const l = document.createElement("a");
                        l.href = URL.createObjectURL(new Blob([txt], { type: "application/json" }));
                        l.download = fn;
                        l.click();
                    })();
                } else if (a === "imp") document.getElementById("imp").click();
                else if (a === "csv") document.getElementById("csv").click();
                else if (a === "tpl") {
                    const t = S.tpl.find((x) => x.id === id);
                    if (t)
                        form("week", null, {
                            title: t.title,
                            type: t.type || "Termin",
                            time: t.time || "",
                            end: t.end || "",
                        });
                } else if (a === "tedit") {
                    tedit = !tedit;
                    render();
                } else if (a === "nref") {
                    D.nref = {
                        f: [
                            ["ref", "Eintrag", "select", nrefOptions()],
                            ["memo", "Notiz", "textarea"],
                        ],
                    };
                    form("nref");
                } else if (a === "rref") {
                    const o = nrefOptions().filter((x) => !x[0].startsWith("rem:"));
                    D.rref = {
                        f: [
                            ["ref", "Eintrag", "select", o.length ? o : [["", "Noch keine Einträge vorhanden"]]],
                            ["rdate", "Erinnerung am", "date"],
                            ["rtime", "Uhrzeit (optional)", "time"],
                        ],
                    };
                    form("rref", null, { rdate: iso(new Date()) });
                } else if (a === "notif") toggleNotif();
                else if (a === "delimp") {
                    if (!delArm) {
                        delArm = true;
                        render();
                        return;
                    }
                    S.fin = S.fin.filter((e) => !(e.imps && e.imps.length && e.imps.every((x) => x === fsrc)));
                    S.fin.forEach((e) => {
                        if (e.imps) e.imps = e.imps.filter((x) => x !== fsrc);
                    });
                    S.imports = (S.imports || []).filter((x) => x.id !== fsrc);
                    fsrc = "";
                    delArm = false;
                    save();
                    render();
                } else if (a === "wp") {
                    const was = tab;
                    tab = "week";
                    wp = el.dataset.k;
                    render();
                    if (was !== "week") {
                        const pe = document.getElementById("wpanel");
                        if (pe && pe.scrollIntoView) pe.scrollIntoView();
                    }
                } else if (a === "per") {
                    fper = el.dataset.k;
                    mo = 0;
                    fcat = "";
                    flim = 60;
                    render();
                } else if (a === "fcat") {
                    fcat = fcat === el.dataset.k ? "" : el.dataset.k;
                    flim = 60;
                    render();
                } else if (a === "more") {
                    flim += 100;
                    render();
                }
            });
            document.addEventListener("submit", (e) => {
                if (e.target.id !== "qa") return;
                e.preventDefault();
                const fd = Object.fromEntries(new FormData(e.target));
                S.week.push({
                    id: uid(),
                    done: false,
                    state: "Offen",
                    type: fd.time ? "Termin" : "Aufgabe",
                    date: fd.date,
                    time: fd.time || "",
                    title: fd.title.trim(),
                });
                wk = Math.round((monday(new Date(fd.date + "T00:00")) - monday(new Date())) / 6048e5);
                save();
                render();
            });
            document.getElementById("csv").onchange = async (ev) => {
                const f = ev.target.files[0];
                if (!f) return;
                const buf = await f.arrayBuffer();
                let txt;
                try {
                    txt = new TextDecoder("utf-8", { fatal: true }).decode(buf);
                } catch (err) {
                    txt = new TextDecoder("windows-1252").decode(buf);
                }
                fmsg = importCamt(txt, f.name);
                ev.target.value = "";
                render();
            };
            document.getElementById("imp").onchange = (ev) => {
                const f = ev.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = () => {
                    let msg;
                    try {
                        const d = JSON.parse(r.result);
                        S = Object.assign(
                            {
                                week: [],
                                fin: [],
                                todos: [],
                                notes: [],
                                rem: [],
                                vac: [],
                                fix: [],
                                imports: [],
                                cfg: { hol: [] },
                            },
                            d
                        );
                        save();
                        norm();
                        msg = "Sicherung importiert.";
                    } catch (err) {
                        msg = "Die Datei konnte nicht gelesen werden.";
                    }
                    render();
                    const st = document.getElementById("st");
                    if (st) st.textContent = msg;
                };
                r.readAsText(f);
                ev.target.value = "";
            };
            document.addEventListener(
                "toggle",
                (e) => {
                    if (e.target.id === "nd") ndet = e.target.open;
                },
                true
            );
            document.addEventListener("change", (e) => {
                if (e.target.id === "fsrc") {
                    fsrc = e.target.value;
                    fcat = "";
                    flim = 60;
                    delArm = false;
                    render();
                    return;
                }
                if (e.target.id === "lead") {
                    S.cfg.lead = +e.target.value;
                    save();
                    render();
                }
            });
            render();
            tick();
            setInterval(tick, 30000);
        </script>
    </body>
</html>
